name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      MUJOCO_GL: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install geo_kin_core (public)
        run: pip install "geo-kin-core @ git+https://github.com/Euler-Rodrigues-Lab/geo_kin_core"
      - name: Install package
        run: pip install -e .[test]
      - name: Run tests (public subset)
        run: pytest -m "not geo" -q || [ $? -eq 5 ]
