[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rby1-teleop"
version = "0.1.0"
description = "Rainbow Robotics RB-Y1 teleoperation: SEW geometric retargeting demos, MuJoCo models/controllers, and hardware glue"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "kczttm" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "mujoco",
    "geo-kin-core",
    "xrt-devices>=0.1.0",
]

[tool.uv.sources]
geo-kin-core = { path = "external/geo_kin_core", editable = true }
xrt-devices = { path = "external/XRT_devices", editable = true }

[tool.geo-kin]
product = "rby1-xhand"

[project.optional-dependencies]
# Hardware: RB-Y1 SDK. XHand's vendor class is loaded lazily from the interim
# independently supplied TeleVision checkout because it is not published on PyPI.
hw = ["rby1-sdk>=0.9,<0.10", "pyserial>=3.5"]
devices = ["xrt-devices[xr,recording]", "geo-kin-core[fallback]"]
mediapipe = ["xrt-devices[mediapipe]", "geo-kin-core[fallback]"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["rby1_teleop*"]

[tool.setuptools.package-data]
rby1_teleop = [
    "assets/specs/*.npz",
    "assets/sample_motion/*.npz",
    "assets/urdf/*.urdf",
    "assets/rby1m/*.xml",
    "assets/rby1m/assets/**/*",
    "assets/rby1_with_xhand/*.xml",
    "assets/rby1_with_xhand/XHAND/*",
    "assets/rby1_with_xhand/LEFT_MOUNT/*",
    "assets/rby1_with_xhand/RIGHT_MOUNT/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "geo: needs the private geo_kin_ref package or the licensed geo_kin wheel (skipped on public CI)",
]
